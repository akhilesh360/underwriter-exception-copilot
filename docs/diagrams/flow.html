<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;width:1800px;height:470px;background:#fff;font-family:"Source Sans 3",Helvetica,Arial,sans-serif;padding:40px 40px}
h1{margin:0 0 32px;font-size:46px;color:#2A0A6E;font-weight:800}
.row{display:flex;align-items:center}
.card{width:212px;height:280px;border-radius:22px;padding:24px 20px;color:#fff;box-shadow:0 10px 24px rgba(42,10,110,.14)}
.ic{width:66px;height:66px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.ic svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.k{font-size:19px;font-weight:800;letter-spacing:.09em;opacity:.92;margin-bottom:6px}
.t{font-size:25px;font-weight:800;line-height:1.18}
.chev{width:34px;display:flex;justify-content:center}
.chev svg{width:16px;height:28px;fill:none;stroke:#B8B0E3;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.red{background:#B42318}.violet{background:#3A0CA3}.purple{background:#5B3FC4}.teal{background:#0F8B8D}.amber{background:#C98A0B}.dark{background:#2A0A6E}
.hl{background:#F4C95D;color:#2A0A6E}.hl .ic{background:rgba(42,10,110,.12)}.hl svg{stroke:#2A0A6E}
</style></head><body>
<h1>Underwriter exception copilot · Rules + AI + Playbook</h1>
<div class="row">
<div class="card red"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="k">PROBLEM</div><div class="t">Flagged cases eat research time</div></div>
<div class="chev"><svg viewBox="0 0 16 28"><path d="M3 3l10 11L3 25"/></svg></div>
<div class="card violet"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></div><div class="k">DETECT</div><div class="t">Rules, not LLM</div></div>
<div class="chev"><svg viewBox="0 0 16 28"><path d="M3 3l10 11L3 25"/></svg></div>
<div class="card purple"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg></div><div class="k">DRAFT</div><div class="t">Copilot AI brief, cited</div></div>
<div class="chev"><svg viewBox="0 0 16 28"><path d="M3 3l10 11L3 25"/></svg></div>
<div class="card teal"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div><div class="k">VALIDATE</div><div class="t">Quotes verified vs source</div></div>
<div class="chev"><svg viewBox="0 0 16 28"><path d="M3 3l10 11L3 25"/></svg></div>
<div class="card amber"><div class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div><div class="k">GOVERN</div><div class="t">Playbook blocks approval, 403</div></div>
<div class="chev"><svg viewBox="0 0 16 28"><path d="M3 3l10 11L3 25"/></svg></div>
<div class="card dark"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></div><div class="k">DECIDE</div><div class="t">Human + rationale, audited</div></div>
<div class="chev"><svg viewBox="0 0 16 28"><path d="M3 3l10 11L3 25"/></svg></div>
<div class="card hl"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></div><div class="k">MEASURE</div><div class="t">8 eval scenarios, raw vs validated</div></div>
</div></body></html>
